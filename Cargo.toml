[workspace]
resolver = "3"
members = [
    "crates/glassctl",
    "crates/glasstap",
]

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.91"
hickory-resolver = "0.26.1"
ipnet = "2.12.0"
once_cell = "1.21.4"
pingora = "0.9.1"
pingora-load-balancing = "0.9.1"
pingora-proxy = "0.9.1"
tokio = "1.54.1"
bytes = "1.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.3", features = ["v7", "serde"] }